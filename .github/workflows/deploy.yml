name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Record Markdown changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          revision="$GITHUB_SHA"
          if [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BEFORE^{commit}"; then
            revision="$BEFORE..$GITHUB_SHA"
          fi
          python3 scripts/i18n/release.py log "$revision" > "$RUNNER_TEMP/markdown-changes.txt"

      - name: Check English and Russian release versions
        run: |
          set -o pipefail
          python3 scripts/i18n/release.py deploy-report | tee "$RUNNER_TEMP/i18n-review.txt"

      - name: Record translation review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translation-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/i18n-review.txt
            ${{ runner.temp }}/markdown-changes.txt

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload dist/
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_PATH: ${{ secrets.SSH_PATH }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes" \
            dist/ "$SSH_USER@$SSH_HOST:$SSH_PATH/"
